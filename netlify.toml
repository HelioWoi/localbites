[build]
  command = "npm run build"
  publish = "dist"

# Serve static files first (robots.txt, sitemap.xml) - prevent SPA fallback
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = true

# SPA fallback for all routes (including root)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
