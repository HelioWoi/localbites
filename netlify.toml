[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_URL,SUPABASE_SERVICE_KEY"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."enhance-photo"]
  timeout = 26

[functions."enhance-photo-background"]
  timeout = 26

[functions."enhance-photo-demo-background"]
  timeout = 26

[functions."process-photo-jobs"]
  timeout = 26
  schedule = "*/1 * * * *"

# Edge Functions for dynamic Open Graph tags
[[edge_functions]]
  function = "og-tags"
  path = "/r/*"

# Serve static files first (robots.txt, sitemap.xml) - prevent SPA fallback
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = true

# SPA fallback for all routes (Edge Functions run BEFORE this redirect)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
