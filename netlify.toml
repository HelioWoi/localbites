[build]
  command = "npm run build"
  publish = "dist"

# Edge Functions for dynamic Open Graph tags
[[edge_functions]]
  function = "og-tags"
  path = "/r/*"

# Serve static files first (robots.txt, sitemap.xml) - prevent SPA fallback
[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/sitemap.xml"
  status = 200
  force = true

# SPA fallback for all routes (Edge Functions run BEFORE this redirect)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
